[project]
name = "vcc-context-module-cvae"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "cell-eval2[gpudge]",
    "cupy-cuda13x>=14.2.0",
    "h5py==3.16.0",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy==1.18.1",
    "torch==2.14.0",
    "wandb==0.30.0",
]

[tool.uv]
package = false
required-environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
cell-eval2 = { git = "https://github.com/ArcInstitute/cell-eval2", rev = "5e64833518a6603a0301cbe28185d49c30f4a986" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
