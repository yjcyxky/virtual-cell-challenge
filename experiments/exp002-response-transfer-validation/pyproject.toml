[project]
name = "vcc-response-transfer-validation"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "h5py",
    "pyarrow",
    "wandb",
    "anndata==0.13.4",
    "vcc-cli==0.2.1",
    "cell-eval2[gpudge]>=0.16.0",
    "cupy-cuda13x==14.2.0",
    "torch==2.14.0",
    "pyyaml==6.0.3",
    "pytest==9.1.1",
]
[tool.uv]
package = false
required-environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
cell-eval2 = { git = "https://github.com/ArcInstitute/cell-eval2", rev = "5e64833518a6603a0301cbe28185d49c30f4a986" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
